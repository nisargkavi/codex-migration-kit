name: Migration workflow issue
description: Report a problem with synthetic or redacted evidence.
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: This report contains no real backup, transcript, credentials, or private database dump.
          required: true
  - type: input
    id: direction
    attributes:
      label: Source and destination OS
      placeholder: Windows to macOS
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Codex versions, if known
      description: Include app or CLI versions without account or machine identifiers.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the operation and its status. Use invented paths and IDs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Describe a disposable fixture; do not attach your .codex folder.
